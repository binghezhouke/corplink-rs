[package]
name = "corplink-rs"
version = "0.5.4"
edition = "2021"

[dependencies]
regex = "1.10"
# default-features disabled to drop the native-tls/OpenSSL backend (a C dep that
# would otherwise be dynamically linked). rustls-tls is pure Rust, so the binary
# links no system TLS library. trust-dns swaps the resolver from libc's
# getaddrinfo to a pure-Rust one: a statically-linked glibc binary otherwise
# dlopen()s libnss_*.so at runtime for DNS, which breaks when the binary is
# copied to a host with a different glibc. With trust-dns the static binary
# resolves names itself and is portable across distros.
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "gzip",
    "deflate",
    "cookies",
    "rustls-tls",
    "trust-dns",
] }
# for debug
# reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "deflate", "cookies", "rustls-tls", "trust-dns", "socks"] }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
cookie = "0.17"
cookie_store = "0.20"
reqwest_cookie_store = "0.6"
tinytemplate = "1.2"
md5 = "0.7"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
base32 = "0.4"
base64 = "0.21"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
httpdate = "1.0"
chrono = "0.4"
cfg-if = "1.0"
# linux privilege check
sudo = "0.6"
# windows privilege check
is_elevated = "0.1"
# windows unix socket
uds_windows = "1.1"

# string_template = "0.2"
# dependency for basic-otp
# basic-otp = "0.1"
hmac-sha1 = "0.1"
byteorder = "1.5"
log = "0.4"
env_logger = "0.10"
libc = "0.2"
terminal_graphics = "0.1.5"
qrcode = "0.14.1"
anyhow = "1.0"

[build-dependencies]
bindgen = "0.68"
